<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIGC 群島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="scene" aria-label="AIGC 群島 3D 世界：十八座課程島嶼依週次以橋相連"></canvas>

<div class="hud">
  <header class="hud-top">
    <div class="panel brand">
      <span class="eyebrow">人工智慧生成內容應用 · 室內設計系碩士班</span>
      <h1>AIGC 群島</h1>
      <div class="progress">
        <span class="rank" id="rank">新手拓荒者</span>
        <span class="vp"><b id="vp">0</b> 勝利點</span>
      </div>
    </div>
    <div class="top-right">
      <nav class="panel menu" aria-label="選單">
        <button type="button" class="btn secondary sm" id="openList">週次地圖</button>
        <button type="button" class="btn secondary sm" id="openBag">背包</button>
        <button type="button" class="btn primary sm" id="openHub">課程總覽</button>
      </nav>
      <canvas id="minimap" class="panel minimap" aria-hidden="true"></canvas>
    </div>
  </header>

  <div class="hud-center">
    <div class="panel interact" id="interact" hidden>
      <div>
        <span class="eyebrow" id="interactEyebrow"></span>
        <strong id="interactTitle"></strong>
      </div>
      <button type="button" class="btn primary sm" id="enterBtn">開啟單元 <kbd>E</kbd></button>
    </div>
    <p class="panel help" id="help">
      <span class="kb-only">WASD／方向鍵移動 · Shift 奔跑 · 空白鍵跳 · 拖曳畫面轉視角 · 滾輪縮放 · 走上島按 E 開啟課程</span>
      <span class="touch-only">左下搖桿移動 · 拖曳畫面轉視角 · 走上島嶼開啟課程</span>
    </p>
  </div>

  <div class="hud-bottom">
    <div class="joystick touch-only" id="joystick" aria-hidden="true"><span></span></div>
    <ul class="panel res-bar" id="resBar" aria-label="資源"></ul>
    <section class="panel dice" aria-label="擲骰">
      <div class="dice-row">
        <div class="die" id="die1" aria-hidden="true"></div>
        <div class="die" id="die2" aria-hidden="true"></div>
        <button type="button" class="btn primary" id="rollBtn">擲骰子</button>
      </div>
      <div class="roll-result" id="rollResult" aria-live="polite">擲骰後，號碼相同且已建村莊的島會產出資源。</div>
    </section>
  </div>
</div>

<div class="nogl" id="nogl" hidden>
  <div class="panel">
    <h2>無法載入 3D 畫面</h2>
    <p>這台裝置或瀏覽器不支援 WebGL。你仍然可以從「週次地圖」開啟每週單元、建造與擲骰。</p>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <div class="drawer-head">
    <div>
      <p class="eyebrow" id="drawerEyebrow"></p>
      <h2 id="drawerTitle"></h2>
    </div>
    <button type="button" class="btn secondary" id="drawerClose">關閉 <kbd>Esc</kbd></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
</body>
</html>
